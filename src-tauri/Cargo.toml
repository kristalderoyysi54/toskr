[package]
name = "toskr"
version = "0.2.2"
description = "Toskr — AI 工作流的划词摘录与 Prompt 暂存工具"
authors = ["kai"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "toskr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# 本地静态加密信封（data_crypto）：关默认特性，随机数走 /dev/urandom 自取
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
libc = "0.2"
zip = { version = "4.6.1", default-features = false }
enigo = "0.6"
arboard = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
url = "2.5"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-global-shortcut = "2"
objc2-vision = { version = "0.3.2", features = ["VNRecognizeTextRequest", "VNRequest", "VNObservation", "VNRequestHandler", "VNTypes"] }
# 推推 CDP 免手动注入：连推推调试端口的 WebSocket 客户端（仅 ws:// 明文，无 TLS）
tokio = { version = "1", features = ["rt", "time", "net", "sync", "io-util", "macros"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink", "async-await"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
security-framework = "3.7"
security-framework-sys = "2.17"
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSString",
  "NSURL",
  "NSData",
  "NSDictionary",
  "NSNotification",
  "NSOperation",
  "NSEnumerator",
  "NSArray",
  "NSError",
  "NSDate",
  "block2",
] }
objc2-app-kit = { version = "0.3", features = [
  "NSWorkspace",
  "NSRunningApplication",
  "NSWindow",
  "NSResponder",
  "NSGraphics",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSAnimation",
  "NSAnimationContext",
  "NSScreen",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
