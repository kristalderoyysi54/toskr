<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Toskr 三步使用流程</title>
  <desc id="desc">从多个来源应用收集文字和图片，在 Toskr 中整理并检查隐私，再粘贴到当前 AI 输入框。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a09"/>
      <stop offset="1" stop-color="#11120f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="30" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="260" fill="#d9e4ce" opacity="0.045"/>
  <circle cx="130" cy="650" r="300" fill="#fc8a2b" opacity="0.035"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif">
    <g transform="translate(62 48)">
      <rect width="42" height="42" rx="12" fill="#fbeadb"/>
      <path d="M13 26c6-1 8-8 7-14 7 5 11 12 8 19-2 5-9 6-15 3" fill="none" stroke="#241c12" stroke-width="2.5" stroke-linecap="round"/>
      <text x="56" y="29" fill="#efede6" font-family="Georgia, serif" font-size="26" font-weight="700">Toskr</text>
      <rect x="900" y="5" width="176" height="32" rx="16" fill="#d9e4ce" fill-opacity="0.08" stroke="#d9e4ce" stroke-opacity="0.18"/>
      <text x="988" y="26" text-anchor="middle" fill="#b9c9ab" font-size="12" letter-spacing="1.5">MACOS 13+</text>
    </g>

    <text x="62" y="132" fill="#efede6" font-family="Georgia, 'Songti SC', serif" font-size="38" font-weight="700">把散落在各个应用里的内容，整理后粘贴给 AI</text>
    <text x="62" y="166" fill="#9b978d" font-size="16">文字、图片、隐私检查和投递，一条清楚的路径。</text>

    <g transform="translate(62 206)" filter="url(#shadow)">
      <rect width="292" height="292" rx="18" fill="#11110f" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="24" y="38" fill="#7f7b72" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2">01  收集</text>
      <text x="24" y="72" fill="#e8e6df" font-size="18" font-weight="600">来源应用</text>

      <g transform="translate(24 94)">
        <rect width="244" height="46" rx="10" fill="#ffffff" fill-opacity="0.045"/>
        <circle cx="23" cy="23" r="10" fill="#b9cf9e" fill-opacity="0.18"/>
        <text x="44" y="20" fill="#dad7ce" font-size="12">浏览器里的资料</text>
        <text x="44" y="35" fill="#7f7b72" font-size="10">选中文字</text>
      </g>
      <g transform="translate(24 150)">
        <rect width="244" height="46" rx="10" fill="#ffffff" fill-opacity="0.045"/>
        <circle cx="23" cy="23" r="10" fill="#fbeadb" fill-opacity="0.14"/>
        <text x="44" y="20" fill="#dad7ce" font-size="12">聊天里的需求</text>
        <text x="44" y="35" fill="#7f7b72" font-size="10">连按两次 ⇧ Shift</text>
      </g>
      <g transform="translate(24 206)">
        <rect width="244" height="46" rx="10" fill="#ffffff" fill-opacity="0.045"/>
        <rect x="13" y="13" width="20" height="20" rx="5" fill="#fc8a2b" fill-opacity="0.18"/>
        <text x="44" y="20" fill="#dad7ce" font-size="12">剪贴板里的截图</text>
        <text x="44" y="35" fill="#7f7b72" font-size="10">文字和图片都能收</text>
      </g>
    </g>

    <path d="M374 352h44" stroke="#b9cf9e" stroke-opacity="0.65" stroke-width="2"/>
    <path d="m411 345 9 7-9 7" fill="none" stroke="#b9cf9e" stroke-opacity="0.65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(438 190)" filter="url(#shadow)">
      <rect width="324" height="324" rx="20" fill="#151512" stroke="#d9e4ce" stroke-opacity="0.22"/>
      <text x="24" y="38" fill="#91a482" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2">02  整理</text>
      <text x="24" y="72" fill="#efede6" font-size="20" font-weight="700">Toskr</text>
      <g transform="translate(202 52)">
        <rect width="98" height="26" rx="13" fill="#d9e4ce" fill-opacity="0.09"/>
        <text x="49" y="18" text-anchor="middle" fill="#b9c9ab" font-size="10">隐私检查开启</text>
      </g>

      <g transform="translate(24 96)">
        <rect width="276" height="56" rx="11" fill="#ffffff" fill-opacity="0.055" stroke="#d9e4ce" stroke-opacity="0.18"/>
        <circle cx="22" cy="20" r="7" fill="#b9cf9e"/>
        <path d="m19 20 2 2 4-5" fill="none" stroke="#172011" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="42" y="22" fill="#dedbd0" font-size="12">需求背景和上下文</text>
        <text x="42" y="41" fill="#8b877d" font-size="10">邮箱已替换为占位符</text>
      </g>
      <g transform="translate(24 162)">
        <rect width="276" height="56" rx="11" fill="#ffffff" fill-opacity="0.055" stroke="#d9e4ce" stroke-opacity="0.18"/>
        <circle cx="22" cy="20" r="7" fill="#b9cf9e"/>
        <path d="m19 20 2 2 4-5" fill="none" stroke="#172011" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="42" y="22" fill="#dedbd0" font-size="12">报错截图</text>
        <text x="42" y="41" fill="#8b877d" font-size="10">敏感文字已生成遮挡副本</text>
      </g>
      <g transform="translate(24 228)">
        <rect width="276" height="42" rx="10" fill="#ffffff" fill-opacity="0.035"/>
        <circle cx="22" cy="21" r="7" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
        <text x="42" y="25" fill="#b7b3a9" font-size="12">输出格式要求</text>
      </g>
      <g transform="translate(24 282)">
        <text x="0" y="18" fill="#7f7b72" font-size="10">2 项已选，可拖动排序</text>
        <rect x="196" y="0" width="80" height="30" rx="8" fill="#fbeadb"/>
        <text x="236" y="20" text-anchor="middle" fill="#241c12" font-size="11" font-weight="600">⌘ Enter</text>
      </g>
    </g>

    <path d="M782 352h44" stroke="#b9cf9e" stroke-opacity="0.65" stroke-width="2"/>
    <path d="m819 345 9 7-9 7" fill="none" stroke="#b9cf9e" stroke-opacity="0.65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(848 206)" filter="url(#shadow)">
      <rect width="290" height="292" rx="18" fill="#11110f" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="24" y="38" fill="#7f7b72" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2">03  粘贴</text>
      <text x="24" y="72" fill="#e8e6df" font-size="18" font-weight="600">当前 AI 输入框</text>
      <g transform="translate(24 96)">
        <rect width="242" height="116" rx="12" fill="#ffffff" fill-opacity="0.045"/>
        <rect x="14" y="16" width="156" height="6" rx="3" fill="#e8e6df" fill-opacity="0.55"/>
        <rect x="14" y="32" width="118" height="6" rx="3" fill="#e8e6df" fill-opacity="0.24"/>
        <rect x="14" y="54" width="54" height="44" rx="8" fill="#fc8a2b" fill-opacity="0.12" stroke="#fc8a2b" stroke-opacity="0.22"/>
        <path d="m25 86 10-12 8 8 10-15" fill="none" stroke="#c89b70" stroke-width="2" stroke-linecap="round"/>
        <rect x="82" y="59" width="126" height="6" rx="3" fill="#e8e6df" fill-opacity="0.35"/>
        <rect x="82" y="76" width="96" height="6" rx="3" fill="#e8e6df" fill-opacity="0.20"/>
      </g>
      <g transform="translate(24 224)">
        <rect width="242" height="42" rx="10" fill="#d9e4ce" fill-opacity="0.07" stroke="#d9e4ce" stroke-opacity="0.32"/>
        <text x="16" y="26" fill="#d9d6cd" font-size="11">已粘贴，确认后再提交</text>
        <rect x="218" y="12" width="2" height="18" rx="1" fill="#b9cf9e"/>
      </g>
    </g>

    <g transform="translate(62 548)">
      <rect width="1076" height="42" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="24" y="27" fill="#a9a59a" font-size="12">多个来源 → 一次投递批次</text>
      <circle cx="334" cy="21" r="2" fill="#5f5c55"/>
      <text x="366" y="27" fill="#a9a59a" font-size="12">文字与图片隐私默认在本机处理</text>
      <circle cx="706" cy="21" r="2" fill="#5f5c55"/>
      <text x="738" y="27" fill="#a9a59a" font-size="12">默认只粘贴，不自动按 Enter 提交</text>
    </g>
  </g>
</svg>
